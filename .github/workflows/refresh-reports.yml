name: Refresh Dota Reports

on:
  workflow_dispatch:
    inputs:
      recent:
        description: Ranked matches to inspect
        required: false
        default: "50"
      max_new:
        description: Maximum unseen matches to process
        required: false
        default: "25"
      parse_wait:
        description: Seconds to wait after batched OpenDota parse requests
        required: false
        default: "180"

permissions:
  contents: write

concurrency:
  group: dota-report-refresh-main
  cancel-in-progress: false

jobs:
  refresh-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --python 3.13 --group cli

      - name: Refresh evidence-ready reports
        env:
          STRATZ_API_KEY: ${{ secrets.STRATZ_API_KEY }}
          RECENT_LIMIT: ${{ github.event.inputs.recent || '50' }}
          MAX_NEW: ${{ github.event.inputs.max_new || '25' }}
          PARSE_WAIT: ${{ github.event.inputs.parse_wait || '180' }}
        run: >-
          uv run --no-sync python scripts/refresh_public_reports.py
          --recent "$RECENT_LIMIT"
          --max-new "$MAX_NEW"
          --parse-wait "$PARSE_WAIT"

      - name: Run unit tests
        run: uv run --no-sync python -m unittest discover -s tests -p "test*.py"

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q analysis api db report scripts worker main.py worker_entry.py

      - name: Validate static Pages site
        run: uv run --no-sync python scripts/check_public_site.py

      - name: Commit refreshed public site
        id: commit
        shell: bash
        run: |
          git add -- public
          if git diff --cached --quiet -- public; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh dota reports"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
