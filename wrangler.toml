name = "cstd-help-api"
main = ".worker-build/worker_entry.py"
base_dir = ".worker-build"
compatibility_date = "2026-07-12"
compatibility_flags = ["python_workers", "disable_python_external_sdk"]
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ACCOUNT_ID = "173776719"
GITHUB_REPOSITORY = "Muguett-DBY/cstd-help"
GITHUB_EVIDENCE_WORKFLOW = "on-demand-review.yml"
GITHUB_MATCH_REFRESH_WORKFLOW = "on-demand-match-refresh.yml"
GITHUB_EVIDENCE_REF = "main"

[[rules]]
type = "Text"
globs = ["analysis/rules/*.json"]
fallthrough = false

[[kv_namespaces]]
binding = "REVIEW_CACHE"
id = "37577b67ad5f47b2a0e03b4d5a5ee929"

[[routes]]
pattern = "dota.custard.top/api/*"
zone_name = "custard.top"
